# Opereta 의 합성 관리자 설정(picom). 설치 경로는 /etc/xdg/opereta/picom/picom.conf 이고 사용자가
# ~/.config/picom/picom.conf 를 두면 그것이 먼저다. opereta-compositor 가 이 파일로 picom 을 시작한다.
#
# 하는 일: 모든 창의 최종 모양을 같은 반경(12px)으로 둥글게 자르고, 부드러운 그림자와 페이드를 주고, 반투명한 막대와
# 독의 뒤를 흐리게 한다. 이 효과가 앱이 직접 장식하든 창 관리자가 장식하든 같은 모양이 되게 한다.
backend = "glx";
vsync = true;
use-damage = true;

corner-radius = 12;
round-borders = 1;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT'"
];

shadow = true;
shadow-radius = 22;
shadow-opacity = 0.30;
shadow-offset-x = 0;
shadow-offset-y = 8;
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "window_type = 'tooltip'",
  "_GTK_FRAME_EXTENTS@:c",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT'",
  "class_g = 'Plank'"
];

fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 6;

blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;
blur-background-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = true;

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.96; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; };
  dropdown_menu = { opacity = 0.98; };
};
