# Opereta 한/영 키: 오른쪽 Alt 를 Hangul 키로, 오른쪽 Ctrl 을 Hanja 키로 만든다(한국어 자판의 표준 방법).
# 한/영 키가 따로 없는 노트북에서도 오른쪽 Alt 한 번으로 한/영이 바뀐다. 이 키는 진짜 Hangul 키이므로 누르는 시간과 상관없이 동작한다.
# 설치 경로는 /etc/X11/xorg.conf.d/90-opereta-keyboard.conf 다. 00-keyboard.conf(레이아웃 설정) 뒤에 읽혀 옵션만 더한다.
# AltGr 가 필요한 자판(독일어 등)을 쓰면 이 파일을 지운다.
Section "InputClass"
    Identifier "Opereta Korean keys"
    MatchIsKeyboard "on"
    Option "XkbOptions" "korean:ralt_hangul,korean:rctrl_hanja"
EndSection
