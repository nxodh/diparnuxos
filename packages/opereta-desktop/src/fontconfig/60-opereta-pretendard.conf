<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Opereta 기본 글꼴은 Pretendard(SIL OFL 1.1, Debian 의 fonts-pretendard)다. 한글과 영문 모두 이 글꼴이 먼저 쓰이고,
     빠진 글자는 이전 순서(Noto Sans CJK, Nanum, DejaVu)로 채워진다. 고정폭 글꼴은 바꾸지 않는다. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Pretendard</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Pretendard</family></prefer>
  </alias>
  <alias binding="same">
    <family>Sans</family>
    <prefer><family>Pretendard</family></prefer>
  </alias>
</fontconfig>
