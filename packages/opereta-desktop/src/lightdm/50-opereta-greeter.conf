# Opereta 로그인 화면(lightdm-gtk-greeter). 설치 경로는 /usr/share/lightdm/lightdm-gtk-greeter.conf.d/50-opereta.conf 다.
# 01_debian.conf 뒤에 읽혀 desktop-base 의 배경과 테마를 Opereta 것으로 바꾼다. 배경은 작은 이미지를 늘리지 않고 밝은 단색으로 둔다.
[greeter]
background=#f2f2f2
user-background=false
theme-name=Opereta
icon-theme-name=Adwaita
font-name=Pretendard 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
default-user-image=/usr/share/opereta/brand/opereta-logo-512.png
clock-format=%H:%M
position=50%,center 50%,center
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~power
