# 서버 모드(그래픽 세션이 없는 로그인)에서는 소리 서비스를 시작하지 않는다.
# 설치 경로는 /usr/lib/systemd/user/pipewire-pulse.service.d/50-diparnux-graphical-only.conf 다.
# Xfce 세션은 Xsession 이 DISPLAY 를 사용자 관리자(systemd --user)로 넘긴 뒤, 소리를 쓰는 프로그램이 소켓에 접속할 때
# 서비스를 시작한다(소켓 활성화). 서버 모드에서는 DISPLAY 가 없어 시작하지 않는다(약 18 MiB 절약).
[Unit]
ConditionEnvironment=DISPLAY
