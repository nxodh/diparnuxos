# Opereta 의 Calamares 설정이다. 설치 경로는 /etc/calamares/settings.conf 다.
#
# 복사(unpackfs)는 라이브 시스템의 squashfs 마운트에서 직접 한다. 대상 시스템의 마무리는 opereta-install 의
# 하위 명령(target-prepare, target-bootloader)이 맡는다. Calamares 의 bootloader, initramfs, packages 모듈은
# 쓰지 않는다. Debian 의 설정은 이 단계에서 네트워크로 grub-efi 를 내려받아 오프라인 설치가 되지 않는다.
# displaymanager 모듈도 쓰지 않는다. 로그인 화면(lightdm)의 설정은 이미지에 들어 있고 설치본에는 자동 로그인이 없다.
---
modules-search: [ local ]

instances:
- id: operetamode
  module: packagechooser
  config: opereta-mode.conf
- id: opereta-prepare
  module: shellprocess
  config: opereta-prepare.conf
- id: opereta-bootloader
  module: shellprocess
  config: opereta-bootloader.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@operetamode
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - hwclock
  - shellprocess@opereta-prepare
  - shellprocess@opereta-bootloader
  - umount
- show:
  - finished

branding: opereta
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
