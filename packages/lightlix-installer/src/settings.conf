# Lightlix 의 Calamares 설정이다. 설치 경로는 /etc/calamares/settings.conf 다.
#
# 복사(unpackfs)는 라이브 시스템의 squashfs 마운트에서 직접 한다. 대상 시스템의 마무리는 lightlix-install 의
# 하위 명령(target-prepare, target-bootloader)이 맡는다. Calamares 의 bootloader, initramfs, packages 모듈은
# 쓰지 않는다. Debian 의 설정은 이 단계에서 네트워크로 grub-efi 를 내려받아 오프라인 설치가 되지 않는다.
# displaymanager 모듈도 쓰지 않는다. 그 모듈의 greetd 처리는 그리터 사용자를 greeter 로 가정해 Debian 의 _greetd 와 맞지 않는다.
---
modules-search: [ local ]

instances:
- id: lightlixmode
  module: packagechooser
  config: lightlix-mode.conf
- id: lightlix-prepare
  module: shellprocess
  config: lightlix-prepare.conf
- id: lightlix-bootloader
  module: shellprocess
  config: lightlix-bootloader.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@lightlixmode
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - hwclock
  - shellprocess@lightlix-prepare
  - shellprocess@lightlix-bootloader
  - umount
- show:
  - finished

branding: lightlix
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
