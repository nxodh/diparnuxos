# Lightlix 패널(yambar). labwc 의 autostart 가 이 파일로 실행한다.
# 왼쪽: 로고 글자와 활성 창 제목. 오른쪽: 네트워크, 사용 중인 메모리, 시계.
# 로고 글자를 누르면 Control Center 가 열리고, 네트워크를 누르면 네트워크 페이지가 열린다.
# 색은 로고의 흑백 두 가지다. 설정은 `yambar -C -c` 로 검증한다.
bar:
  height: 26
  location: top
  background: 0d0d0dff
  foreground: ebebebff
  font: NanumGothic:pixelsize=13, DejaVu Sans:pixelsize=13
  left:
    - label:
        content:
          string:
            text: " LIGHTLIX "
            font: NanumGothic:pixelsize=13:style=bold
            on-click: lightlix-control-center
    - foreign-toplevel:
        content:
          map:
            conditions:
              ~activated: {empty: {}}
              activated:
                - string: {text: " {title} ", max: 40, foreground: 8e8e8eff}
  right:
    - script:
        path: /usr/bin/lightlix-panel-net
        content:
          string:
            text: " {net} "
            on-click: lightlix-control-center --page network
    - mem:
        poll-interval: 5000
        content:
          string: {text: " RAM {used:mb} MB "}
    - clock:
        time-format: "%H:%M"
        date-format: "%m/%d"
        content:
          string:
            text: " {date} {time} "
            on-click: lightlix-control-center
