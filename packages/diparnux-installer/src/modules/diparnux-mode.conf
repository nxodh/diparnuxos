# 설치 직후의 기본 모드를 고른다. 선택은 전역 저장소 키 packagechooser_diparnuxmode 에 들어가고
# diparnux-prepare 의 shellprocess 가 --mode 로 넘긴다. 나중에 diparnux mode 로 바꿀 수 있다.
---
mode: required
method: legacy
labels:
    step: "Mode"
items:
    - id: desktop
      name: "Desktop mode"
      description: "Starts the graphical login (Xfce). Uses more memory."
      packages: []
    - id: server
      name: "Server mode"
      description: "Console only. The smallest memory use; turn the desktop on later with 'diparnux mode desktop'."
      packages: []
default: [ desktop ]
