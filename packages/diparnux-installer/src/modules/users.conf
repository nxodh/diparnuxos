# 계정 설정이다. 사용자 이름과 비밀번호는 diparnux-user 규칙(8~128자의 출력 가능한 ASCII)과 같게 둔다.
# 만든 계정은 diparnux, video, render 그룹과 sudo 그룹에 들어간다. 자동 로그인은 쓰지 않는다.
---
defaultGroups:
    - name: diparnux
      must_exist: true
      system: true
    - name: video
      must_exist: true
      system: true
    - name: render
      must_exist: true
      system: true
sudoersGroup: sudo
autologinGroup: autologin
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
doAutologin: false
passwordRequirements:
    minLength: 8
    maxLength: 128
    libpwquality:
        - minlen=8
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
    shell: /bin/bash
    forbidden_names: [ root, user ]
    home_permissions: "o700"
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "diparnux"
    forbidden_names: [ localhost ]
allowActiveDirectory: false
presets:
    fullName:
        editable: true
    loginName:
        editable: true
