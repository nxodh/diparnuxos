# 계정 설정이다. 사용자 이름과 비밀번호는 diparnux-user 규칙(8~128자의 출력 가능한 ASCII)과 같게 둔다.
# 만든 계정은 diparnux, video, render 그룹과 sudo 그룹에 들어간다. 자동 로그인은 쓰지 않는다.
# Calamares 3.3 은 sudoersGroup 으로 /etc/sudoers.d/10-installer 에 "%sudo ALL=(ALL) ALL" 만 쓰고 계정을 그 그룹에 넣지 않는다.
# 계정이 관리자가 되려면 sudo 를 defaultGroups 에도 적어야 한다(설치기에서 만드는 계정은 관리자 하나다).
---
defaultGroups:
    - name: diparnux
      must_exist: true
      system: true
    - name: video
      must_exist: true
      system: true
    - name: render
      must_exist: true
      system: true
    - name: sudo
      must_exist: true
      system: true
sudoersGroup: sudo
autologinGroup: autologin
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
doAutologin: false
passwordRequirements:
    minLength: 8
    maxLength: 128
    libpwquality:
        - minlen=8
        # 이미지에는 사전 파일(cracklib)이 없다. 사전 검사를 켜 두면 어떤 비밀번호도 "error loading dictionary" 로 거절된다.
        # 비밀번호 규칙은 8~128자의 출력 가능한 ASCII 이고 diparnux-user 가 다시 검사한다.
        - dictcheck=0
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
    shell: /bin/bash
    forbidden_names: [ root, user ]
    home_permissions: "o700"
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "diparnux"
    forbidden_names: [ localhost ]
allowActiveDirectory: false
presets:
    fullName:
        editable: true
    loginName:
        editable: true
