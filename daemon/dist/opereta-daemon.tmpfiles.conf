# systemd-tmpfiles 설정. 설치 경로는 /usr/lib/tmpfiles.d/opereta-daemon.conf 다.
# tmpfiles.d(5) 형식이다. 각 줄은 타입, 경로, 모드, 소유자, 그룹, 나이 순이다.
#
# /run/opereta 는 opereta-nvidia 패키지의 /usr/lib/tmpfiles.d/opereta.conf 가 이미 만든다.
# 같은 경로를 여기서 다시 정의하지 않는다.

# 데몬의 영속 상태와 설정 디렉터리다. 데몬(root)만 쓴다.
d /var/lib/opereta 0750 root opereta-llm -
# 모델 파일이 있는 디렉터리다. opereta-llm 은 ReadOnlyPaths 로 읽기만 한다.
d /var/lib/opereta/models 2750 root opereta-llm -
# 관리자 설정 파일 /etc/opereta/operetad.json 이 있는 디렉터리다.
d /etc/opereta 0750 root root -
# 상시 가동을 끌 때 데몬이 /dev/null 링크를 만드는 디렉터리다(opereta power off).
d /etc/systemd/logind.conf.d 0755 root root -
d /etc/systemd/sleep.conf.d 0755 root root -
# Deberopa 자동 갱신(opereta-update deberopa). 상태 파일은 데몬이 읽고, 내려받은 실행 파일은 모든 사용자가 실행하므로
# 0750 인 /var/lib/opereta 밖(/usr/local/lib/opereta)에 둔다.
d /var/lib/opereta/deberopa 0755 root root -
d /usr/local/lib/opereta 0755 root root -
d /usr/local/lib/opereta/deberopa 0755 root root -
