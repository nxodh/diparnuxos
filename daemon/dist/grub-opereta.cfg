# Opereta 의 GRUB 설정이다. 설치 경로는 /etc/default/grub.d/20-opereta.cfg 다.
# 기본 부팅 항목을 저장된 값으로 둔다. opereta-update 는 새 커널을 한 번만 부팅해 보고(grub-reboot),
# 부팅 뒤 검증이 통과해야 저장된 기본값(grub-set-default)을 바꾼다. 새 커널이 부팅하지 못하면 다음 부팅은 이전 커널이다.
GRUB_DEFAULT=saved
GRUB_SAVEDEFAULT=false
# 부팅 항목 ID 가 gnulinux-<버전>-advanced-<UUID> 형식의 최상위 항목이 되도록 하위 메뉴를 쓰지 않는다.
GRUB_DISABLE_SUBMENU=y
GRUB_DISABLE_RECOVERY=true
