# Diparnux 상시 가동: 덮개를 닫거나 오래 두어도 절전이나 종료로 서버가 멈추지 않게 한다.
# 설치 경로는 /usr/lib/systemd/logind.conf.d/50-diparnux-always-on.conf 다.
# 끄려면 diparnux power off (/etc/systemd/logind.conf.d 에 같은 이름의 /dev/null 링크를 만든다).
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
# 전원 버튼을 잠깐 눌러서 종료되는 일을 막는다. 끌 때는 길게 눌러 강제로 끄거나 명령(poweroff)을 쓴다.
HandlePowerKey=ignore
IdleAction=ignore
