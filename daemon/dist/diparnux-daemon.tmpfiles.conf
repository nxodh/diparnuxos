# systemd-tmpfiles 설정. 설치 경로는 /usr/lib/tmpfiles.d/diparnux-daemon.conf 다.
# tmpfiles.d(5) 형식이다. 각 줄은 타입, 경로, 모드, 소유자, 그룹, 나이 순이다.
#
# /run/diparnux 는 diparnux-nvidia 패키지의 /usr/lib/tmpfiles.d/diparnux.conf 가 이미 만든다.
# 같은 경로를 여기서 다시 정의하지 않는다.

# 데몬의 영속 상태와 설정 디렉터리다. 데몬(root)만 쓴다.
d /var/lib/diparnux 0750 root diparnux-llm -
# 모델 파일이 있는 디렉터리다. diparnux-llm 은 ReadOnlyPaths 로 읽기만 한다.
d /var/lib/diparnux/models 2750 root diparnux-llm -
# 관리자 설정 파일 /etc/diparnux/diparnuxd.json 이 있는 디렉터리다.
d /etc/diparnux 0750 root root -
