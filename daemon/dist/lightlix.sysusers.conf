# systemd-sysusers 설정. 설치 경로는 /usr/lib/sysusers.d/lightlix.conf 다.
# sysusers.d(5) 형식이다. 줄 단위로 읽고 "#" 으로 시작하는 줄만 주석이다.

# 그룹 lightlix: 데몬 소켓 /run/lightlix/lightlixd.sock 에 접근할 수 있는 사용자 그룹이다.
g lightlix - -

# 시스템 사용자 lightlix-llm: llama-server 를 실행한다.
# 홈 디렉터리는 /nonexistent 로 두어 쓸 곳이 없게 하고, 로그인 셸은 /usr/sbin/nologin 으로 막는다.
# 이름과 같은 그룹 lightlix-llm 도 함께 만들어진다. API 키 파일(0640)은 이 그룹이 읽는다.
u lightlix-llm - "Lightlix llama-server" /nonexistent /usr/sbin/nologin

# DRM 장치가 그룹 접근을 요구할 때 전용 실행 사용자가 읽고 쓸 수 있게 한다.
g video -
g render -
m lightlix-llm video
m lightlix-llm render
