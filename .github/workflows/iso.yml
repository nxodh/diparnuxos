# Lightlix ISO CI
#
# 중요: 러너의 OS(ubuntu-24.04)는 Docker 호스트로만 쓰인다.
# ISO 내용물은 scripts/build-in-docker.sh 가 띄우는 Debian 13 빌더 컨테이너 안에서만 만들어진다.
# 부팅 테스트도 Debian 컨테이너 안에서 돈다(scripts/test-qemu-in-docker.sh). 러너의 Ubuntu 저장소는 쓰지 않는다.
#
# 러너 라벨: ubuntu-latest 는 runner-images README(main, 2026-10 확인) 기준 ubuntu-24.04 를 가리킨다.
# 라벨이 바뀌어 빌드 환경이 조용히 달라지지 않도록 ubuntu-24.04 를 직접 고정한다.
#
# 액션 버전: 각 액션의 최신 릴리스 태그와 그 태그가 가리키는 커밋 SHA 로 고정했다.
# 올릴 때는 gh api repos/<owner>/<repo>/releases/latest 와 git/ref/tags/<tag> 로 다시 확인한다.

name: iso

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: make lint

      - name: Test GPU diagnostics without hardware
        run: make test-gpu-check

  iso:
    name: iso build and boot test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub 호스팅 Linux 러너의 KVM 은 /dev/kvm 권한을 udev 규칙으로 연다
      # (GitHub changelog 2024-04-02 의 방법). 없으면 boot-smoke.sh 가 TCG 로 돌리고 제한 시간을 늘린다.
      - name: Enable KVM (best effort)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "::notice::/dev/kvm is not present on this runner; the boot test will use TCG"
          fi
          ls -l /dev/kvm 2>/dev/null || true

      - name: Build ISO
        run: make iso

      - name: Check NVIDIA modules and image policy
        run: make test-nvidia-image-docker

      - name: Boot test (UEFI, serial login prompt)
        run: make test-qemu-docker

      - name: Boot test (UEFI, ISO as USB storage)
        run: make test-qemu-usb-docker

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lightlix-iso
          path: |
            out/*.iso
            out/*.sha256
          if-no-files-found: error
          retention-days: 7
