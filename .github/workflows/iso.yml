# Lightlix ISO CI
#
# 중요: 러너의 OS(ubuntu-24.04)는 Docker 호스트로만 쓰인다.
# ISO 내용물은 scripts/build-in-docker.sh 가 띄우는 Debian 13 빌더 컨테이너 안에서만 만들어진다.
# 부팅 테스트도 Debian 컨테이너 안에서 돈다(scripts/test-qemu-in-docker.sh). 러너의 Ubuntu 저장소는 쓰지 않는다.
#
# 러너 라벨: ubuntu-latest 는 runner-images README(main, 2026-10 확인) 기준 ubuntu-24.04 를 가리킨다.
# 라벨이 바뀌어 빌드 환경이 조용히 달라지지 않도록 ubuntu-24.04 를 직접 고정한다.
#
# 액션 버전: 각 액션의 최신 릴리스 태그와 그 태그가 가리키는 커밋 SHA 로 고정했다.
# 올릴 때는 gh api repos/<owner>/<repo>/releases/latest 와 git/ref/tags/<tag> 로 다시 확인한다.

name: iso

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: make lint

      - name: Test GPU diagnostics without hardware
        run: make test-gpu-check

      - name: Test QEMU E2E driver with controlled fixtures
        run: make test-qemu-e2e-driver

      # python3-gi, GTK4, libadwaita 와 xvfb 는 컨테이너 안에만 설치한다.
      - name: Test Control Center (unit and GTK smoke)
        run: make test-gui

      # 가짜 저장소에서 실제 apt 와 dpkg 로 커널과 드라이버 갱신, 롤백, 실패 복구를 확인한다.
      - name: Test lightlix-update with real apt (container)
        run: make test-update-docker

      # Debian의 Go와 gcc를 쓰고 저장소는 읽기 전용으로 복사한다. 모듈 내려받기는 막는다.
      - name: Build and test daemon and CLI
        run: |
          . ./lightlix.conf
          docker run --rm -v "$PWD:/src:ro" "debian:${DEBIAN_SUITE}" bash -ec '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends golang-go gcc libc6-dev make ca-certificates
            mkdir /work
            cp -a /src/daemon /src/Makefile /src/lightlix.conf /work/
            cd /work
            GOPROXY=off GOTOOLCHAIN=local make test-daemon
          '

  iso:
    name: iso build and boot test
    runs-on: ubuntu-24.04
    # llama.cpp 의 CUDA 컴파일 시간은 아직 측정하지 않았다. 첫 실행이 120분을 넘을 수 있어 180분으로 둔다.
    timeout-minutes: 180
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub 호스팅 Linux 러너의 KVM 은 /dev/kvm 권한을 udev 규칙으로 연다
      # (GitHub changelog 2024-04-02 의 방법). 없으면 boot-smoke.sh 가 TCG 로 돌리고 제한 시간을 늘린다.
      - name: Enable KVM (best effort)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "::notice::/dev/kvm is not present on this runner; the boot test will use TCG"
          fi
          ls -l /dev/kvm 2>/dev/null || true

      # llama.cpp 빌드 산출물(out/llama)을 캐시한다. 키는 llama/ 와 lightlix.conf 의 해시다(README.md 는 제외).
      # hashFiles 의 '!' 제외 패턴은 docs.github.com 의 expressions 문서 예시(hashFiles('/lib/**/*.rb', '!/lib/foo/*.rb'))로 확인했다.
      # 같은 키의 캐시가 있으면 make llama 는 BUILD_KEY 를 보고 빌드를 건너뛴다.
      - name: Restore llama.cpp build output
        id: llama-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/llama
          key: llama-${{ runner.os }}-${{ hashFiles('llama/**', '!llama/README.md', 'lightlix.conf') }}

      - name: Build llama.cpp package (lightlix-llm)
        run: make llama

      - name: Check lightlix-llm package without CUDA
        run: make test-llama-docker

      # ISO·부팅 검사가 실패해도 검증된 CUDA 산출물은 다음 실행에서 재사용한다.
      - name: Save verified llama.cpp package
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/llama
          key: ${{ steps.llama-cache.outputs.cache-primary-key }}

      - name: Build ISO
        run: make iso

      - name: Check NVIDIA modules and image policy
        run: make test-nvidia-image-docker

      - name: Boot test (UEFI, serial login prompt)
        run: make test-qemu-docker

      - name: Boot test (UEFI, ISO as USB storage)
        run: make test-qemu-usb-docker

      - name: CPU inference E2E (UEFI, live user, Hugging Face NAT)
        timeout-minutes: 35
        env:
          BOOT_TIMEOUT: '900'
          COMMAND_TIMEOUT: '120'
          PULL_TIMEOUT: '600'
          START_TIMEOUT: '300'
          CHAT_TIMEOUT: '180'
          E2E_TIMEOUT: '1800'
        run: make test-qemu-e2e-docker

      # 같은 ISO 로 서버 모드에서 데스크톱 모드로 전환하고 greetd, labwc, Control Center 를 확인한다.
      - name: Desktop session E2E (UEFI, mode switch, virtual display)
        timeout-minutes: 25
        env:
          BOOT_TIMEOUT: '900'
          COMMAND_TIMEOUT: '120'
          START_TIMEOUT: '300'
          E2E_TIMEOUT: '1200'
        run: make test-qemu-desktop-docker

      # 같은 ISO 로 빈 가상 디스크에 헤드리스 설치하고, 디스크 부팅과 Secure Boot(shim) 부팅까지 확인한다.
      - name: Installer E2E (UEFI, install to disk, boot from disk, Secure Boot)
        timeout-minutes: 45
        env:
          BOOT_TIMEOUT: '900'
          COMMAND_TIMEOUT: '120'
          START_TIMEOUT: '300'
          INSTALL_TIMEOUT: '1500'
          UPDATE_TIMEOUT: '400'
          E2E_TIMEOUT: '3000'
        run: make test-qemu-install-docker

      - name: Upload QEMU E2E logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lightlix-qemu-e2e-logs
          path: |
            out/qemu-e2e/
            out/qemu-desktop/
            out/qemu-install/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lightlix-iso
          path: |
            out/*.iso
            out/*.sha256
          if-no-files-found: error
          retention-days: 7
