# Opereta 빌드 설정. 저장소 URL과 버전 값은 이 파일 한 곳에서만 정의한다.
# 셸에서 source 할 수 있는 KEY=VALUE 형식이며 명령 치환은 쓰지 않는다.

# Opereta 정체성 (os-release, dpkg origin, ISO 이름에 쓰인다)
OPERETA_NAME="Opereta"
OPERETA_ID="opereta"
OPERETA_VERSION="0.6.2"
OPERETA_HOME_URL="https://github.com/nxodh/operetaos"
# Opereta 자체 APT 저장소. 0.6.0 부터 GitHub 릴리스 자산을 저장소로 쓴다: 평평한 형식(flat)이고 주소는 항상
# 가장 최근 릴리스를 가리킨다. 서명 키(keys/opereta-archive-keyring.pgp)가 없는 빌드는 소스를
# opereta-archive-keyring 이 Enabled: no 로 설치한다(docs/apt-repository.md, docs/releases.md).
OPERETA_APT_URL="https://github.com/nxodh/operetaos/releases/latest/download"
OPERETA_APT_LAYOUT="flat"
# 릴리스에 ISO 를 올릴지(yes/no). yes 이면 ISO 와 함께 ISO 에 들어간 모든 Debian 패키지의 대응 소스(GPL 등)를 같은 릴리스에
# 올린다(scripts/collect-sources.py). 소스가 없으면 릴리스 자산 모으기가 거절한다. 이 이미지에는 NVIDIA CUDA 런타임이 없다
# (사용자의 컴퓨터가 NVIDIA 에서 받는다). 근거와 남은 쟁점은 docs/licenses.md 10절, 절차는 docs/releases.md 에 있다.
# no 여도 릴리스에는 OS 업데이트 저장소(opereta-* 패키지: 이 프로젝트의 코드와 MIT 소프트웨어)가 올라간다.
OPERETA_PUBLISH_ISO="yes"

# Debian 기반 배포판, 저장소 구성요소, 미러 설정
DEBIAN_SUITE="trixie"
DEBIAN_VERSION="13"
DEBIAN_AREAS="main non-free-firmware"
DEBIAN_MIRROR="http://deb.debian.org/debian"
DEBIAN_SECURITY_MIRROR="http://security.debian.org/debian-security"
# 비어 있으면 위 미러를 쓰고, YYYYMMDDTHHMMSSZ 값이면 아래 snapshot 주소의 그 시점을 쓴다.
DEBIAN_SNAPSHOT=""
DEBIAN_SNAPSHOT_URL="https://snapshot.debian.org/archive"

# NVIDIA 공식 저장소와 드라이버 고정 값
NVIDIA_REPO_URL="https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64"
NVIDIA_BRANCH="595"
NVIDIA_DRIVER_VERSION="595.91.07"
NVIDIA_DEB_REVISION="1"
NVIDIA_PIN_VERSION="595-1"
NVIDIA_PIN_SHA256="652f8080d7acc53640fadcba0a3d94580472e31094410dfff1d8829e21500d6d"
CUDA_KEYRING_VERSION="1.1-1"
CUDA_KEYRING_SHA256="d0d4ef986a44400f9db33c600ef33a985175e7cc63d805a10e1839c7a1e78f5f"

# CUDA 런타임은 ISO 에 포함하지 않는다(아래). 컴파일러는 llama 빌드 환경(별도 컨테이너)에서만 쓴다.
CUDA_VERSION="13.2.2"
CUDA_PKG_SUFFIX="13-2"
# CUDA 런타임 패키지 버전. 이미지에는 들어 있지 않다. 사용자의 컴퓨터가 NVIDIA 저장소에서 이 버전을 직접 받는다
# (opereta gpu runtime install). llama 빌더는 컴파일할 때 같은 버전을 쓴다.
CUDA_CUDART_VERSION="13.2.86-1"
CUDA_CUBLAS_VERSION="13.4.1.3-1"

# llama.cpp 고정 값. 빌드는 LLAMA_CPP_COMMIT 으로 소스를 받고, 받은 커밋이 이 값과 같은지 확인한다.
# LLAMA_CPP_TAG 는 사람이 읽는 이름이다. 태그가 옮겨져도 빌드 결과가 바뀌지 않도록 커밋 SHA 를 쓴다.
LLAMA_CPP_TAG="v0.6.0"
LLAMA_CPP_REPO="https://github.com/ggml-org/llama.cpp"
LLAMA_CPP_COMMIT="d81235049384534c167caea52b85a694f6103d14"
# llama 빌더 이미지(llama/Dockerfile)가 설치하는 CUDA 빌드 패키지 버전. 런타임은 위의 CUDA_*_VERSION 을 쓴다.
CUDA_MINIMAL_BUILD_VERSION="13.2.2-1"
# opereta-llm 이 설치되는 절대 경로. llama/build.sh 가 이 경로에 맞춰 패키지 트리를 만든다.
LLAMA_INSTALL_DIR="/usr/lib/opereta/llama"

# Deberopa(코딩 에이전트) 고정 값. opereta-deberopa 패키지가 릴리스 자산 deberopa-linux-x64.tar.gz 를 받아 SHA-256 을 확인한다.
# 값을 올릴 때는 릴리스의 checksums.txt 에서 deberopa-linux-x64.tar.gz 의 해시를 함께 옮긴다.
DEBEROPA_VERSION="0.2.0"
DEBEROPA_REPO="https://github.com/nxodh/deberopa"
DEBEROPA_SHA256="7fcede00c34b213e1b2a1bda39f88075c6611030cd73188e6ec0a72d14cb1a22"

# go-nvml 고정 버전 (Phase 1 이후에 쓴다. Phase 0 스크립트는 사용하지 않는다)
GO_NVML_VERSION="v0.13.4-1"
